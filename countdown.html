<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Clock & Countdown Header</title>
  <style>
    :root {
      --jp-accent: #ff4757;
      --tw-accent: #00d2d3;
      --cd-accent: #ffa502;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #191919;
    }

    /* ヘッダー全体コンテナ */
    .header-container {
      position: relative;
      width: 100%;
      height: 100vh;
      background-image: url('https://itta.me/assets/img/article/10295/01.jpg');
      background-size: cover;
      background-position: center;
      background-color: #0f1117; /* 画像読み込み時や透明画像時のグラデーション下地 */
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 20px;
    }

    /* オーバーレイ：暗めの背景グラデーション */
    .header-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at top right, rgba(0,210,211,0.15), transparent 40%),
                  linear-gradient(to bottom, rgba(15, 17, 23, 0.3) 0%, rgba(15, 17, 23, 0.95) 100%);
      z-index: 1;
    }

    .header-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 上段：時計グリッド */
    .clock-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* カード共通スタイル（すりガラス調） */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
    }
    .card-jp::before { background: var(--jp-accent); }
    .card-tw::before { background: var(--tw-accent); }
    .card-cd::before { background: var(--cd-accent); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .card-jp .label { color: #ff6b81; }
    .card-tw .label { color: #70a1ff; }
    .card-cd .label { color: var(--cd-accent); }

    .date-display {
      font-size: 0.65rem;
      color: var(--text-sub);
    }

    .time-display {
      font-size: 1.4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      color: var(--text-main);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .seconds {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    /* 下段：カウントダウンタイマー */
    .countdown-card {
      padding: 8px 14px;
    }

    .cd-grid {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 4px;
      text-align: center;
    }

    .cd-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cd-value {
      font-size: 1.35rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      line-height: 1;
    }

    .cd-unit {
      font-size: 0.58rem;
      color: var(--text-sub);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cd-colon {
      font-size: 1rem;
      font-weight: 700;
      color: var(--cd-accent);
      margin-bottom: 8px;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.62rem;
      color: var(--text-sub);
      padding: 0 4px;
    }

    .time-diff span {
      color: var(--tw-accent);
      font-weight: 600;
    }

    @media (max-width: 420px) {
      .time-display { font-size: 1.2rem; }
      .cd-value { font-size: 1.1rem; }
      .header-container { padding: 10px; }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header-content">
      
      <!-- 世界時計エリア -->
      <div class="clock-grid">
        <!-- Japan Clock -->
        <div class="glass-card card-jp">
          <div class="card-header">
            <span class="label">🇯🇵 TOKYO</span>
            <span class="date-display" id="jp-date">--/-- (--)</span>
          </div>
          <div class="time-display">
            <span id="jp-time">00:00</span><span class="seconds" id="jp-sec">:00</span>
          </div>
        </div>

        <!-- Taipei Clock -->
        <div class="glass-card card-tw">
          <div class="card-header">
            <span class="label">🇹🇼 TAIPEI</span>
            <span class="date-display" id="tw-date">--/-- (--)</span>
          </div>
          <div class="time-display">
            <span id="tw-time">00:00</span><span class="seconds" id="tw-sec">:00</span>
          </div>
        </div>
      </div>

      <!-- カウントダウンタイマーエリア -->
      <div class="glass-card card-cd countdown-card">
        <div class="card-header">
          <span class="label">⏳ COUNTDOWN</span>
          <span class="date-display">Target: 11/30 11:45</span>
        </div>
        <div class="cd-grid">
          <div class="cd-item">
            <span class="cd-value" id="cd-days">00</span>
            <span class="cd-unit">Days</span>
          </div>
          <span class="cd-colon">:</span>
          <div class="cd-item">
            <span class="cd-value" id="cd-hours">00</span>
            <span class="cd-unit">Hours</span>
          </div>
          <span class="cd-colon">:</span>
          <div class="cd-item">
            <span class="cd-value" id="cd-mins">00</span>
            <span class="cd-unit">Mins</span>
          </div>
          <span class="cd-colon">:</span>
          <div class="cd-item">
            <span class="cd-value" id="cd-secs">00</span>
            <span class="cd-unit">Secs</span>
          </div>
        </div>
      </div>

      <!-- 下部フッター情報 -->
      <div class="footer-bar">
        <div class="time-diff">時差: 台北は日本より <span>1時間遅い</span> です</div>
      </div>

    </div>
  </div>

  <script>
    const daysJP = ['日', '月', '火', '水', '木', '金', '土'];

    // カウントダウン目標日時の計算（毎年11月30日 11:45:00 JST）
    function getTargetDate() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(targetYear, 10, 30, 11, 45, 0); // 月は0始まり（10 = 11月）
      
      // 今年の11月30日11:45を過ぎていたら翌年に設定
      if (now > target) {
        target = new Date(targetYear + 1, 10, 30, 11, 45, 0);
      }
      return target;
    }

    const targetDate = getTargetDate();

    function updateDashboard() {
      const now = new Date();

      // 1. 日本時間 (UTC+9)
      const jpFormatter = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      const jpParts = Object.fromEntries(jpFormatter.formatToParts(now).map(p => [p.type, p.value]));
      const jpDateObj = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));

      document.getElementById('jp-time').innerText = `${jpParts.hour}:${jpParts.minute}`;
      document.getElementById('jp-sec').innerText = `:${jpParts.second}`;
      document.getElementById('jp-date').innerText = `${jpParts.month}/${jpParts.day} (${daysJP[jpDateObj.getDay()]})`;

      // 2. 台北時間 (UTC+8)
      const twFormatter = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      const twParts = Object.fromEntries(twFormatter.formatToParts(now).map(p => [p.type, p.value]));
      const twDateObj = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));

      document.getElementById('tw-time').innerText = `${twParts.hour}:${twParts.minute}`;
      document.getElementById('tw-sec').innerText = `:${twParts.second}`;
      document.getElementById('tw-date').innerText = `${twParts.month}/${twParts.day} (${daysJP[twDateObj.getDay()]})`;

      // 3. カウントダウン計算
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('cd-days').innerText = '00';
        document.getElementById('cd-hours').innerText = '00';
        document.getElementById('cd-mins').innerText = '00';
        document.getElementById('cd-secs').innerText = '00';
      } else {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / (1000 * 60)) % 60);
        const secs = Math.floor((diff / 1000) % 60);

        document.getElementById('cd-days').innerText = String(days).padStart(2, '0');
        document.getElementById('cd-hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('cd-mins').innerText = String(mins).padStart(2, '0');
        document.getElementById('cd-secs').innerText = String(secs).padStart(2, '0');
      }
    }

    updateDashboard();
    setInterval(updateDashboard, 1000);
  </script>
</body>
</html>
