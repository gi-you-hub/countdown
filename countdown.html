<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUD Dashboard - Mobile Optimized</title>
  <style>
    :root {
      /* カラーパレット */
      --c-taipei: #00d2d3;  /* 台北用アクセント（シアン） */
      --c-cd: #ffa502;      /* カウントダウン用（ゴールド） */
      --c-rate: #2ed573;    /* 為替レート用（エメラルドグリーン） */
      
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.8);
      
      /* 枠線と背景 */
      --card-bg: rgba(10, 15, 25, 0.35);
      --card-border: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* 背景画像：高透過・固定1枚 */
    .dashboard-container {
      position: relative;
      width: 100%;
      height: 100vh;
      background-image: url('https://www.travel.taipei/image/339510/?r=1673063414149');
      background-size: cover;
      background-position: center;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dashboard-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.45) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* 透過HUDカード */
    .hud-card {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 6px;
      min-width: 0; /* 折り返し防止 */
    }

    /* 四隅のノッチ */
    .hud-card::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 4px; height: 4px;
      border-right: 1.5px solid rgba(255, 255, 255, 0.4);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.4);
    }

    .card-title {
      font-size: 0.52rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
    }

    .label-taipei { 
      color: var(--c-taipei) !important; 
      text-shadow: 0 0 6px rgba(0, 210, 211, 0.6), 0 1px 3px rgba(0,0,0,0.9) !important; 
    }
    .label-rate { 
      color: var(--c-rate) !important; 
      text-shadow: 0 0 6px rgba(46, 213, 115, 0.6), 0 1px 3px rgba(0,0,0,0.9) !important; 
    }

    /* 上部：枠なしダイレクト・カウントダウン */
    .top-right-section {
      display: flex;
      justify-content: flex-end;
      position: relative;
      z-index: 2;
    }

    .direct-countdown {
      text-align: right;
      padding: 2px 4px;
    }

    .countdown-header {
      font-size: 0.5rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--c-cd);
      text-shadow: 0 0 6px rgba(255, 165, 2, 0.6), 0 1px 3px rgba(0,0,0,0.9);
      margin-bottom: -2px;
    }

    .countdown-val {
      font-size: 2rem;
      font-weight: 900;
      color: var(--c-cd);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(255, 165, 2, 0.8), 0 2px 5px rgba(0,0,0,0.9);
    }

    .countdown-unit {
      font-size: 0.48rem;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 1.2px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
      margin-top: -1px;
    }

    /* 下部：スマホでも絶対に横並び（3列固定） */
    .bottom-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 5px;
      align-items: end;
      width: 100%;
    }

    /* 台湾時間 */
    .time-num {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.7), 0 2px 4px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }

    .time-sec {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 600;
    }

    /* 為替レート */
    .rate-val {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--c-rate);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 8px rgba(46, 213, 115, 0.7), 0 2px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
    }

    .rate-unit {
      font-size: 0.65rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.8);
      margin-left: 1px;
    }

    /* 台北天気 */
    .weather-forecast {
      display: flex;
      justify-content: space-between;
      gap: 2px;
    }

    .weather-day {
      text-align: center;
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2px 1px;
      border-radius: 4px;
      min-width: 0;
    }

    .weather-date { font-size: 0.48rem; color: var(--text-sub); font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
    .weather-icon { font-size: 0.8rem; margin: 1px 0; filter: drop-shadow(0 0 3px rgba(0,0,0,0.9)); }
    .weather-temp {
      font-size: 0.55rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <div class="dashboard-container">

    <!-- 右上：枠なしダイレクト・カウントダウン -->
    <div class="top-right-section">
      <div class="direct-countdown">
        <div class="countdown-header">COUNTDOWN</div>
        <div class="countdown-val" id="cd-days">--</div>
        <div class="countdown-unit">DAYS LEFT</div>
      </div>
    </div>

    <!-- 下部：スマホでも横並び3カラム（時間・為替・天気） -->
    <div class="bottom-grid">

      <!-- 1. 台湾時間 -->
      <div class="hud-card">
        <div class="card-title label-taipei">🇹🇼 TAIPEI TIME</div>
        <div class="time-num">
          <span id="tw-time">00:00</span><span class="time-sec" id="tw-sec">:00</span>
        </div>
      </div>

      <!-- 2. 為替レート -->
      <div class="hud-card">
        <div class="card-title label-rate">🪪 TWD / JPY</div>
        <div class="rate-val">
          <span id="twd-rate">--.--</span><span class="rate-unit">円</span>
        </div>
      </div>

      <!-- 3. 台北3日間天気 -->
      <div class="hud-card">
        <div class="card-title label-taipei">🇹🇼 TAIPEI FORECAST</div>
        <div class="weather-forecast" id="tw-weather">
          <div class="weather-day"><div class="weather-date">今日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
          <div class="weather-day"><div class="weather-date">明日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
          <div class="weather-day"><div class="weather-date">明後日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // 1. カウントダウン
    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(targetYear, 10, 30, 11, 45, 0);
      if (now > target) {
        target = new Date(targetYear + 1, 10, 30, 11, 45, 0);
      }
      const diff = target - now;
      const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
      document.getElementById('cd-days').innerText = days;
    }

    // 2. 為替レート (TWD -> JPY)
    async function fetchExchangeRate() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/TWD');
        const data = await res.json();
        if (data && data.rates && data.rates.JPY) {
          document.getElementById('twd-rate').innerText = data.rates.JPY.toFixed(2);
        }
      } catch (e) {
        console.log('為替データ取得失敗');
      }
    }

    // 3. 台北時間更新
    function updateClocks() {
      const now = new Date();
      const twFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const twP = Object.fromEntries(twFmt.formatToParts(now).map(p => [p.type, p.value]));
      document.getElementById('tw-time').innerText = `${twP.hour}:${twP.minute}`;
      document.getElementById('tw-sec').innerText = `:${twP.second}`;
    }

    // 4. 台北天気予報
    function getWeatherEmoji(code) {
      if (code === 0) return '☀️';
      if (code >= 1 && code <= 3) return '⛅';
      if (code >= 45 && code <= 48) return '🌫️';
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return '🌧️';
      if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return '❄️';
      if (code >= 95) return '🌩️';
      return '🌤️';
    }

    async function fetchWeatherData() {
      const twUrl = 'https://api.open-meteo.com/v1/forecast?latitude=25.0330&longitude=121.5654&daily=weathercode,temperature_2m_max&timezone=Asia%2FTaipei';

      try {
        const res = await fetch(twUrl);
        const data = await res.json();

        if (data && data.daily) {
          const codes = data.daily.weathercode;
          const temps = data.daily.temperature_2m_max;
          const labels = ['今日', '明日', '明後日'];
          
          let html = '';
          for (let i = 0; i < 3; i++) {
            html += `
              <div class="weather-day">
                <div class="weather-date">${labels[i]}</div>
                <div class="weather-icon">${getWeatherEmoji(codes[i])}</div>
                <div class="weather-temp">${Math.round(temps[i])}°</div>
              </div>
            `;
          }
          document.getElementById('tw-weather').innerHTML = html;
        }
      } catch (e) {
        console.log('天気データ取得スキップ');
      }
    }

    // 初回実行
    updateCountdown();
    updateClocks();
    fetchWeatherData();
    fetchExchangeRate();

    // 定期更新
    setInterval(updateClocks, 1000);
    setInterval(fetchExchangeRate, 3600000); // 1時間ごと
  </script>
</body>
</html>
