<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Dashboard Header - Komatsu & Taipei</title>
  <style>
    :root {
      --jp-accent: #ff4757;
      --tw-accent: #00d2d3;
      --cd-accent: #ffa502;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.75);
      --card-bg: rgba(18, 22, 30, 0.65);
      --card-border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #191919;
    }

    /* 背景画像＋ダークグラデーションオーバーレイ */
    .dashboard-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background-image: url('https://www.travel.taipei/image/339510/?r=1673063414149');
      background-size: cover;
      background-position: center;
      background-color: #0f1117;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dashboard-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(15,17,23,0.2) 0%, rgba(15,17,23,0.85) 100%);
      z-index: 1;
    }

    /* すりガラスカード共通スタイル */
    .glass-card {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 右上：カウントダウンタイマー */
    .top-right-section {
      display: flex;
      justify-content: flex-end;
      position: relative;
      z-index: 2;
      margin-bottom: 16px;
    }

    .countdown-card {
      text-align: center;
      border-left: 3px solid var(--cd-accent);
      min-width: 140px;
    }

    .countdown-val {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--cd-accent);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .countdown-unit {
      font-size: 0.62rem;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    /* 下部：2カラム構成（左：時間 / 右：天気） */
    .bottom-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: end;
    }

    /* 時間表示スタイル */
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .time-card-jp { border-left: 3px solid var(--jp-accent); }
    .time-card-tw { border-left: 3px solid var(--tw-accent); }

    .city-label-jp { color: #ff6b81 !important; }
    .city-label-tw { color: #70a1ff !important; }

    .time-num {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .time-sec {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    /* 天気表示スタイル */
    .weather-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .weather-city-title {
      font-size: 0.68rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .weather-forecast {
      display: flex;
      justify-content: space-between;
      gap: 3px;
    }

    .weather-day {
      text-align: center;
      flex: 1;
      background: rgba(255,255,255,0.05);
      padding: 6px 2px;
      border-radius: 6px;
    }

    .weather-date { font-size: 0.58rem; color: var(--text-sub); }
    .weather-icon { font-size: 1.05rem; margin: 3px 0; }
    .weather-temp { font-size: 0.65rem; font-weight: 600; color: var(--text-main); }

    @media (max-width: 520px) {
      .bottom-grid { grid-template-columns: 1fr; }
      .time-num { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">

    <!-- 右上：カウントダウンタイマー（日のみ） -->
    <div class="top-right-section">
      <div class="glass-card countdown-card">
        <div class="card-title">COUNTDOWN</div>
        <div class="countdown-val" id="cd-days">--</div>
        <div class="countdown-unit">DAYS LEFT</div>
      </div>
    </div>

    <!-- 下部：時間（左）＆ 天気（右） -->
    <div class="bottom-grid">

      <!-- 左：現在時刻（KOMATSU & TAIPEI） -->
      <div class="time-grid">
        <div class="glass-card time-card-jp">
          <div class="card-title city-label-jp">🇯🇵 KOMATSU</div>
          <div class="time-num">
            <span id="jp-time">00:00</span><span class="time-sec" id="jp-sec">:00</span>
          </div>
        </div>
        <div class="glass-card time-card-tw">
          <div class="card-title city-label-tw">🇹🇼 TAIPEI</div>
          <div class="time-num">
            <span id="tw-time">00:00</span><span class="time-sec" id="tw-sec">:00</span>
          </div>
        </div>
      </div>

      <!-- 右：3日間天気予報（小松JMAモデル & 台北） -->
      <div class="glass-card">
        <div class="card-title">3-DAY FORECAST (JMA / METEO)</div>
        <div class="weather-container">
          <!-- 小松の天気 -->
          <div>
            <div class="weather-city-title city-label-jp">Komatsu (JMA)</div>
            <div class="weather-forecast" id="km-weather">
              <div class="weather-day"><div class="weather-date">今日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
              <div class="weather-day"><div class="weather-date">明日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
              <div class="weather-day"><div class="weather-date">明後日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
            </div>
          </div>
          <!-- 台北の天気 -->
          <div>
            <div class="weather-city-title city-label-tw">Taipei</div>
            <div class="weather-forecast" id="tw-weather">
              <div class="weather-day"><div class="weather-date">今日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
              <div class="weather-day"><div class="weather-date">明日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
              <div class="weather-day"><div class="weather-date">明後日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // 1. カウントダウン（11月30日までの日数）
    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(targetYear, 10, 30, 11, 45, 0);
      if (now > target) {
        target = new Date(targetYear + 1, 10, 30, 11, 45, 0);
      }
      const diff = target - now;
      const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
      document.getElementById('cd-days').innerText = days;
    }

    // 2. 時計更新（小松＝日本標準時 & 台北）
    function updateClocks() {
      const now = new Date();
      
      const jpFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const jpP = Object.fromEntries(jpFmt.formatToParts(now).map(p => [p.type, p.value]));
      document.getElementById('jp-time').innerText = `${jpP.hour}:${jpP.minute}`;
      document.getElementById('jp-sec').innerText = `:${jpP.second}`;

      const twFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const twP = Object.fromEntries(twFmt.formatToParts(now).map(p => [p.type, p.value]));
      document.getElementById('tw-time').innerText = `${twP.hour}:${twP.minute}`;
      document.getElementById('tw-sec').innerText = `:${twP.second}`;
    }

    // 天気コード変換
    function getWeatherEmoji(code) {
      if (code === 0) return '☀️';
      if (code >= 1 && code <= 3) return '⛅';
      if (code >= 45 && code <= 48) return '🌫️';
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return '🌧️';
      if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return '❄️';
      if (code >= 95) return '🌩️';
      return '🌤️';
    }

    // 3. 無料天気API（小松市は気象庁JMA MSMモデルを使用）
    async function fetchWeatherData() {
      const kmUrl = 'https://api.open-meteo.com/v1/forecast?latitude=36.4026&longitude=136.4507&daily=weathercode,temperature_2m_max&timezone=Asia%2FTokyo&models=jma_msm';
      const twUrl = 'https://api.open-meteo.com/v1/forecast?latitude=25.0330&longitude=121.5654&daily=weathercode,temperature_2m_max&timezone=Asia%2FTaipei';

      const renderWeather = (elementId, data) => {
        if (!data || !data.daily) return;
        const codes = data.daily.weathercode;
        const temps = data.daily.temperature_2m_max;
        const labels = ['今日', '明日', '明後日'];
        
        let html = '';
        for (let i = 0; i < 3; i++) {
          html += `
            <div class="weather-day">
              <div class="weather-date">${labels[i]}</div>
              <div class="weather-icon">${getWeatherEmoji(codes[i])}</div>
              <div class="weather-temp">${Math.round(temps[i])}°</div>
            </div>
          `;
        }
        document.getElementById(elementId).innerHTML = html;
      };

      try {
        const [kmRes, twRes] = await Promise.all([fetch(kmUrl), fetch(twUrl)]);
        const kmData = await kmRes.json();
        const twData = await twRes.json();

        renderWeather('km-weather', kmData);
        renderWeather('tw-weather', twData);
      } catch (e) {
        console.log('天気データ取得スキップ');
      }
    }

    // 初期化実行
    updateCountdown();
    updateClocks();
    fetchWeatherData();

    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
