<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUD Dashboard - Simple Color</title>
  <style>
    :root {
      /* カラーパレットを最小限に整理 */
      --c-komatsu: #ff6b81; /* 小松用アクセント（薄赤） */
      --c-taipei: #00d2d3;  /* 台北用アクセント（シアン） */
      --c-cd: #ffa502;      /* カウントダウン用（ゴールド） */
      
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.8);
      
      /* 枠線と背景は白ベースの透明感で統一 */
      --card-bg: rgba(10, 15, 25, 0.25);
      --card-border: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* 背景画像：高透過 */
    .dashboard-container {
      position: relative;
      width: 100%;
      height: 100vh;
      background-image: url('https://www.travel.taipei/image/339510/?r=1673063414149');
      background-size: cover;
      background-position: center;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dashboard-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.35) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* 統一感のある高透過カード */
    .hud-card {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
    }

    /* 四隅の控えめなノッチ */
    .hud-card::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 5px; height: 5px;
      border-right: 1.5px solid rgba(255, 255, 255, 0.4);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.4);
    }

    .card-title {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    /* 都市ラベルの色定義（時計と天気で共通化） */
    .label-komatsu { color: var(--c-komatsu) !important; text-shadow: 0 0 6px rgba(255, 107, 129, 0.6), 0 1px 3px rgba(0,0,0,0.9) !important; }
    .label-taipei { color: var(--c-taipei) !important; text-shadow: 0 0 6px rgba(0, 210, 211, 0.6), 0 1px 3px rgba(0,0,0,0.9) !important; }

    /* 右上：カウントダウン */
    .top-right-section {
      display: flex;
      justify-content: flex-end;
      position: relative;
      z-index: 2;
      margin-bottom: 6px;
    }

    .countdown-card {
      text-align: center;
      border-color: rgba(255, 165, 2, 0.35);
      min-width: 115px;
      padding: 4px 8px;
    }
    .countdown-card::after { border-color: var(--c-cd); }

    .countdown-card .card-title {
      color: var(--c-cd);
      text-shadow: 0 0 6px rgba(255, 165, 2, 0.6), 0 1px 3px rgba(0,0,0,0.9);
    }

    .countdown-val {
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--c-cd);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 8px rgba(255, 165, 2, 0.7), 0 2px 4px rgba(0,0,0,0.9);
    }

    .countdown-unit {
      font-size: 0.52rem;
      color: var(--text-sub);
      letter-spacing: 1px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    }

    /* 下部：2カラムグリッド */
    .bottom-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: end;
    }

    /* 時計 */
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .time-num {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.7), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .time-sec {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 600;
    }

    /* 天気 */
    .weather-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .weather-city-title {
      font-size: 0.58rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .weather-forecast {
      display: flex;
      justify-content: space-between;
      gap: 2px;
    }

    .weather-day {
      text-align: center;
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 3px 1px;
      border-radius: 4px;
    }

    .weather-date { font-size: 0.55rem; color: var(--text-sub); font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
    .weather-icon { font-size: 0.95rem; margin: 1px 0; filter: drop-shadow(0 0 3px rgba(0,0,0,0.9)); }
    .weather-temp {
      font-size: 0.62rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    @media (max-width: 520px) {
      .bottom-grid { grid-template-columns: 1fr; }
      .time-num { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">

    <!-- カウントダウン -->
    <div class="top-right-section">
      <div class="hud-card countdown-card">
        <div class="card-title">COUNTDOWN</div>
        <div class="countdown-val" id="cd-days">--</div>
        <div class="countdown-unit">DAYS LEFT</div>
      </div>
    </div>

    <!-- 下部コンポーネント -->
    <div class="bottom-grid">

      <!-- 時計（小松・台北） -->
      <div class="time-grid">
        <div class="hud-card">
          <div class="card-title label-komatsu">🇯🇵 KOMATSU</div>
          <div class="time-num">
            <span id="jp-time">00:00</span><span class="time-sec" id="jp-sec">:00</span>
          </div>
        </div>
        <div class="hud-card">
          <div class="card-title label-taipei">🇹🇼 TAIPEI</div>
          <div class="time-num">
            <span id="tw-time">00:00</span><span class="time-sec" id="tw-sec">:00</span>
          </div>
        </div>
      </div>

      <!-- 3日間天気（小松・台北） -->
      <div class="hud-card">
        <div class="weather-container">
          <!-- 小松 -->
          <div>
            <div class="weather-city-title label-komatsu">KOMATSU</div>
            <div class="weather-forecast" id="km-weather">
              <div class="weather-day"><div class="weather-date">今日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
              <div class="weather-day"><div class="weather-date">明日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
              <div class="weather-day"><div class="weather-date">明後日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
            </div>
          </div>
          <!-- 台北 -->
          <div>
            <div class="weather-city-title label-taipei">TAIPEI</div>
            <div class="weather-forecast" id="tw-weather">
              <div class="weather-day"><div class="weather-date">今日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
              <div class="weather-day"><div class="weather-date">明日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
              <div class="weather-day"><div class="weather-date">明後日</div><div class="weather-icon">--</div><div class="weather-temp">--°</div></div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // カウントダウン
    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(targetYear, 10, 30, 11, 45, 0);
      if (now > target) {
        target = new Date(targetYear + 1, 10, 30, 11, 45, 0);
      }
      const diff = target - now;
      const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
      document.getElementById('cd-days').innerText = days;
    }

    // 時計更新
    function updateClocks() {
      const now = new Date();
      
      const jpFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const jpP = Object.fromEntries(jpFmt.formatToParts(now).map(p => [p.type, p.value]));
      document.getElementById('jp-time').innerText = `${jpP.hour}:${jpP.minute}`;
      document.getElementById('jp-sec').innerText = `:${jpP.second}`;

      const twFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const twP = Object.fromEntries(twFmt.formatToParts(now).map(p => [p.type, p.value]));
      document.getElementById('tw-time').innerText = `${twP.hour}:${twP.minute}`;
      document.getElementById('tw-sec').innerText = `:${twP.second}`;
    }

    function getWeatherEmoji(code) {
      if (code === 0) return '☀️';
      if (code >= 1 && code <= 3) return '⛅';
      if (code >= 45 && code <= 48) return '🌫️';
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return '🌧️';
      if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return '❄️';
      if (code >= 95) return '🌩️';
      return '🌤️';
    }

    // 天気取得（小松市は気象庁JMA MSMモデルを指定）
    async function fetchWeatherData() {
      const kmUrl = 'https://api.open-meteo.com/v1/forecast?latitude=36.4026&longitude=136.4507&daily=weathercode,temperature_2m_max&timezone=Asia%2FTokyo&models=jma_msm';
      const twUrl = 'https://api.open-meteo.com/v1/forecast?latitude=25.0330&longitude=121.5654&daily=weathercode,temperature_2m_max&timezone=Asia%2FTaipei';

      const renderWeather = (elementId, data) => {
        if (!data || !data.daily) return;
        const codes = data.daily.weathercode;
        const temps = data.daily.temperature_2m_max;
        const labels = ['今日', '明日', '明後日'];
        
        let html = '';
        for (let i = 0; i < 3; i++) {
          html += `
            <div class="weather-day">
              <div class="weather-date">${labels[i]}</div>
              <div class="weather-icon">${getWeatherEmoji(codes[i])}</div>
              <div class="weather-temp">${Math.round(temps[i])}°</div>
            </div>
          `;
        }
        document.getElementById(elementId).innerHTML = html;
      };

      try {
        const [kmRes, twRes] = await Promise.all([fetch(kmUrl), fetch(twUrl)]);
        const kmData = await kmRes.json();
        const twData = await twRes.json();

        renderWeather('km-weather', kmData);
        renderWeather('tw-weather', twData);
      } catch (e) {
        console.log('天気データ取得スキップ');
      }
    }

    updateCountdown();
    updateClocks();
    fetchWeatherData();

    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
