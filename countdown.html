<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Clock - Japan & Taipei</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --jp-accent: #ff4757;
      --tw-accent: #00d2d3;
      --text-main: #f1f2f6;
      --text-sub: #8c7ae6;
      --text-muted: #718093;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* 全体コンテナ：高さを低く横長に */
    .clock-widget {
      background: rgba(22, 25, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px 14px 8px 14px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .clock-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* 各時計カード：横並びレイアウトで省スペース化 */
    .clock-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .clock-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
    }
    .card-jp::before { background: var(--jp-accent); }
    .card-tw::before { background: var(--tw-accent); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .city-name {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-jp .city-name { color: var(--jp-accent); }
    .card-tw .city-name { color: var(--tw-accent); }

    .date-display {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .time-wrapper {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .time-display {
      font-size: 1.45rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
      line-height: 1;
      color: #ffffff;
    }

    .seconds {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 1px;
    }

    /* 時差インフォメーション：1行にスッキリ統合 */
    .time-diff {
      margin-top: 6px;
      padding-top: 4px;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px dashed rgba(255, 255, 255, 0.06);
    }

    .time-diff span {
      color: var(--tw-accent);
      font-weight: 600;
    }

    @media (max-width: 400px) {
      .time-display { font-size: 1.25rem; }
      .seconds { font-size: 0.75rem; }
      .clock-widget { padding: 8px; }
    }
  </style>
</head>
<body>

  <div class="clock-widget">
    <div class="clock-grid">
      <!-- Japan Clock -->
      <div class="clock-card card-jp">
        <div class="card-header">
          <span class="city-name">🇯🇵 TOKYO</span>
          <span class="date-display" id="jp-date">--/-- (--)</span>
        </div>
        <div class="time-wrapper">
          <div class="time-display">
            <span id="jp-time">00:00</span><span class="seconds" id="jp-sec">:00</span>
          </div>
        </div>
      </div>

      <!-- Taipei Clock -->
      <div class="clock-card card-tw">
        <div class="card-header">
          <span class="city-name">🇹🇼 TAIPEI</span>
          <span class="date-display" id="tw-date">--/-- (--)</span>
        </div>
        <div class="time-wrapper">
          <div class="time-display">
            <span id="tw-time">00:00</span><span class="seconds" id="tw-sec">:00</span>
          </div>
        </div>
      </div>
    </div>

    <div class="time-diff">
      時差: 台北は日本より <span>1時間遅い</span> です
    </div>
  </div>

  <script>
    const daysJP = ['日', '月', '火', '水', '木', '金', '土'];

    function updateClocks() {
      const now = new Date();

      // Japan Time (UTC+9)
      const jpFormatter = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      const jpParts = Object.fromEntries(jpFormatter.formatToParts(now).map(p => [p.type, p.value]));
      const jpDateObj = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));

      document.getElementById('jp-time').innerText = `${jpParts.hour}:${jpParts.minute}`;
      document.getElementById('jp-sec').innerText = `:${jpParts.second}`;
      document.getElementById('jp-date').innerText = `${jpParts.month}/${jpParts.day} (${daysJP[jpDateObj.getDay()]})`;

      // Taipei Time (UTC+8)
      const twFormatter = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      const twParts = Object.fromEntries(twFormatter.formatToParts(now).map(p => [p.type, p.value]));
      const twDateObj = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));

      document.getElementById('tw-time').innerText = `${twParts.hour}:${twParts.minute}`;
      document.getElementById('tw-sec').innerText = `:${twParts.second}`;
      document.getElementById('tw-date').innerText = `${twParts.month}/${twParts.day} (${daysJP[twDateObj.getDay()]})`;
    }

    updateClocks();
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
