<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Dashboard Header</title>
  <!-- Chart.js 読み込み（1週間レートグラフ用） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --jp-accent: #ff4757;
      --tw-accent: #00d2d3;
      --cd-accent: #ffa502;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.7);
      --card-bg: rgba(20, 24, 33, 0.55);
      --card-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #191919;
    }

    /* 背景画像＋暗めオーバーレイ */
    .dashboard-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background-image: url('https://www.every-photo.com/clients/img/spacer.gif');
      background-size: cover;
      background-position: center;
      background-color: #0f1117;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dashboard-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(15,17,23,0.3) 0%, rgba(15,17,23,0.92) 100%);
      z-index: 1;
    }

    /* ガラスカード共通CSS */
    .glass-card {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 右上：カウントダウンタイマー（日のみ） */
    .top-right-section {
      display: flex;
      justify-content: flex-end;
      position: relative;
      z-index: 2;
      margin-bottom: 20px;
    }

    .countdown-card {
      text-align: center;
      border-left: 3px solid var(--cd-accent);
      min-width: 150px;
    }

    .countdown-val {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--cd-accent);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .countdown-unit {
      font-size: 0.65rem;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    /* 下部コンテンツグリッド（左右2カラム構造） */
    .bottom-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 左上：時間表示 */
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .time-card-jp { border-left: 3px solid var(--jp-accent); }
    .time-card-tw { border-left: 3px solid var(--tw-accent); }

    .city-label-jp { color: #ff6b81 !important; }
    .city-label-tw { color: #70a1ff !important; }

    .time-num {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .time-sec {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    /* 左下：3日間天気・気温 */
    .weather-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .weather-city-title {
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .weather-forecast {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .weather-day {
      text-align: center;
      flex: 1;
      background: rgba(255,255,255,0.03);
      padding: 4px 2px;
      border-radius: 6px;
    }

    .weather-date { font-size: 0.58rem; color: var(--text-sub); }
    .weather-icon { font-size: 0.9rem; margin: 2px 0; }
    .weather-temp { font-size: 0.62rem; font-weight: 600; color: var(--text-main); }

    /* 右上：為替レート1週間折れ線グラフ */
    .chart-container {
      height: 110px;
      position: relative;
    }

    /* 右下：為替レート表示 */
    .rate-display {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .rate-main {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--tw-accent);
      font-variant-numeric: tabular-nums;
    }

    .rate-sub {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    /* レスポンシブ対応 */
    @media (max-width: 500px) {
      .bottom-grid {
        grid-template-columns: 1fr;
      }
      .time-num { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">

    <!-- 右上：カウントダウンタイマー（日のみ） -->
    <div class="top-right-section">
      <div class="glass-card countdown-card">
        <div class="card-title">COUNTDOWN</div>
        <div class="countdown-val" id="cd-days">--</div>
        <div class="countdown-unit">DAYS LEFT</div>
      </div>
    </div>

    <!-- 下部：2列グリッドエリア -->
    <div class="bottom-grid">

      <!-- 左カラム（時間 ＆ 天気） -->
      <div class="column">
        
        <!-- 左上：日本時間と台北時間の表示 -->
        <div class="time-grid">
          <div class="glass-card time-card-jp">
            <div class="card-title city-label-jp">🇯🇵 TOKYO</div>
            <div class="time-num">
              <span id="jp-time">00:00</span><span class="time-sec" id="jp-sec">:00</span>
            </div>
          </div>
          <div class="glass-card time-card-tw">
            <div class="card-title city-label-tw">🇹🇼 TAIPEI</div>
            <div class="time-num">
              <span id="tw-time">00:00</span><span class="time-sec" id="tw-sec">:00</span>
            </div>
          </div>
        </div>

        <!-- 左下：日本と台北の3日間天気・気温 -->
        <div class="glass-card">
          <div class="card-title">3-DAY WEATHER FORECAST</div>
          <div class="weather-container">
            <!-- 東京の天気 -->
            <div>
              <div class="weather-city-title city-label-jp">Tokyo</div>
              <div class="weather-forecast" id="jp-weather">
                <div class="weather-day"><div class="weather-date">今日</div><div class="weather-icon">☀️</div><div class="weather-temp">28°</div></div>
                <div class="weather-day"><div class="weather-date">明日</div><div class="weather-icon">⛅</div><div class="weather-temp">27°</div></div>
                <div class="weather-day"><div class="weather-date">明後日</div><div class="weather-icon">☁️</div><div class="weather-temp">25°</div></div>
              </div>
            </div>
            <!-- 台北の天気 -->
            <div>
              <div class="weather-city-title city-label-tw">Taipei</div>
              <div class="weather-forecast" id="tw-weather">
                <div class="weather-day"><div class="weather-date">今日</div><div class="weather-icon">🌤️</div><div class="weather-temp">31°</div></div>
                <div class="weather-day"><div class="weather-date">明日</div><div class="weather-icon">🌧️</div><div class="weather-temp">29°</div></div>
                <div class="weather-day"><div class="weather-date">明後日</div><div class="weather-icon">☀️</div><div class="weather-temp">32°</div></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- 右カラム（グラフ ＆ レート） -->
      <div class="column">
        
        <!-- 右上：台湾ドル 日本円 レート 1週間折れ線グラフ -->
        <div class="glass-card">
          <div class="card-title">TWD / JPY (PAST 7 DAYS)</div>
          <div class="chart-container">
            <canvas id="rateChart"></canvas>
          </div>
        </div>

        <!-- 右下：台湾ドル 日本円 レート表示 -->
        <div class="glass-card">
          <div class="card-title">EXCHANGE RATE</div>
          <div class="rate-display">
            <div>
              <span class="rate-sub">1 TWD = </span>
              <span class="rate-main" id="twd-jpy-rate">4.85</span>
              <span class="rate-sub"> JPY</span>
            </div>
            <span class="rate-sub" style="font-size: 0.6rem; color: #00d2d3;">Live Rate</span>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    // 1. カウントダウン（11月30日までの日数のみ計算）
    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(targetYear, 10, 30, 11, 45, 0); // 11/30
      if (now > target) {
        target = new Date(targetYear + 1, 10, 30, 11, 45, 0);
      }
      const diff = target - now;
      const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
      document.getElementById('cd-days').innerText = days;
    }

    // 2. 時計更新（東京 ＆ 台北）
    function updateClocks() {
      const now = new Date();
      
      const jpFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const jpP = Object.fromEntries(jpFmt.formatToParts(now).map(p => [p.type, p.value]));
      document.getElementById('jp-time').innerText = `${jpP.hour}:${jpP.minute}`;
      document.getElementById('jp-sec').innerText = `:${jpP.second}`;

      const twFmt = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const twP = Object.fromEntries(twFmt.formatToParts(now).map(p => [p.type, p.value]));
      document.getElementById('tw-time').innerText = `${twP.hour}:${twP.minute}`;
      document.getElementById('tw-sec').innerText = `:${twP.second}`;
    }

    // 3. 折れ線グラフ描画 (Chart.js)
    function initChart() {
      const ctx = document.getElementById('rateChart').getContext('2d');
      
      // ダミーの過去7日間データ（後からリアルタイムAPI連動も可能）
      const labels = ['7日前', '6日前', '5日前', '4日前', '3日前', '2日前', '今日'];
      const dataPoints = [4.81, 4.83, 4.82, 4.86, 4.84, 4.85, 4.87];

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: dataPoints,
            borderColor: '#00d2d3',
            backgroundColor: 'rgba(0, 210, 211, 0.15)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            pointHoverRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: {
              ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 9 } },
              grid: { display: false }
            },
            y: {
              ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 9 } },
              grid: { color: 'rgba(255,255,255,0.05)' }
            }
          }
        }
      });
    }

    // 無料APIによる最新為替レート取得（自動取得失敗時はデフォルト4.85を表示）
    async function fetchExchangeRate() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/TWD');
        const data = await res.json();
        if (data && data.rates && data.rates.JPY) {
          const rate = data.rates.JPY.toFixed(2);
          document.getElementById('twd-jpy-rate').innerText = rate;
        }
      } catch (e) {
        console.log('為替レートAPI取得スキップ（フォールバック表示）');
      }
    }

    // 初期化実行
    updateCountdown();
    updateClocks();
    initChart();
    fetchExchangeRate();

    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
